# Optional local tooling — Cloudflare dashboard can also set these.
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "dj-vault"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# Secrets / env (do not put API keys in this file):
#   Cloudflare Dashboard → Workers & Pages → project → Settings → Environment variables
#     YOUTUBE_API_KEY              — Encrypt; Production + Preview
#     YOUTUBE_DISCOVERY_ENABLED    — optional plain var; set false/0/off to hard-disable
#                                    YouTube Data API calls (keeps free quota / billing safe)
# Local dev: .env.local with YOUTUBE_API_KEY=... (and optional YOUTUBE_DISCOVERY_ENABLED=false)
#
# KV: short share links + published seed catalog (key seed:catalog).
# Namespace is account-level (Workers KV). Bindings are declared here because
# pages_build_output_dir makes wrangler.toml the source of truth.
#
# Publish seed catalog from the live app:
#   SEED_ADMIN_SECRET — Encrypt in the Pages dashboard (Production + Preview).
#   Local: add SEED_ADMIN_SECRET to .env.local to require the password in `npm run dev`.
#   Without the secret, POST /api/seed is disabled on Pages (503).

[[kv_namespaces]]
binding = "SHARES"
id = "7db899e2c5f4484ca8384994c20bc1d0"
